function interp(arr,t){ // arr of [t,...vals] eased
  if(t<=arr[0][0]) return arr[0].slice(1);
  for(let i=0;i<arr.length-1;i++){const a=arr[i],b=arr[i+1];if(t>=a[0]&&t<=b[0]){const x=b[0]===a[0]?1:eio((t-a[0])/(b[0]-a[0]));return a.slice(1).map((v,j)=>lerp(v,b[j+1],x));}}
  return arr[arr.length-1].slice(1);
}

    if(p<1) s+=`<circle cx="${s0[0]}" cy="${s0[1]}" r="9" fill="#4d8de6"/><circle cx="${lerp(s0[0],e[0],p)}" cy="${lerp(s0[1],e[1],p)-6}" r="9" fill="#fff" stroke="#4d8de6" stroke-width="3"/>`;});
  const n=TYPE.filter(x=>x>=6.75&&x<=7.3&&x<=t).length;
  if(t>=6.67) s+=`<text x="1180" y="575" font-family="Mont" font-weight="800" font-size="160" letter-spacing="-5" fill="#fff">${'Spotify'.slice(0,n)}</text>`+(Math.floor(t*4)%2&&t<7.5?`<rect x="${1182+n*76}" y="440" width="6" height="160" fill="#fff"/>`:'');
  $('vdraw').innerHTML=s;
}

// export sfx events for audio
window.SFX={clicks:CLK,typing:TYPE,keys:KEYS.map(k=>k[0]),drags:DRAG};
window.render=render;
function ready(){return ['ifV','ifB','ifA'].every(id=>{try{return $(id).contentWindow.READY===true}catch(e){return false}});}
document.fonts.ready.then(()=>{const w=()=>{if(ready()){render(0);window.READY=true;}else setTimeout(w,50)};w();});
if(location.search.includes('play')){const st=performance.now();(function loop(){const t=((performance.now()-st)/1000)%30.5;if(window.READY)render(t);requestAnimationFrame(loop)})();}
</script>
