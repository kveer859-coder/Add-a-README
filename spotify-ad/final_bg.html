<!doctype html>
<html><head><meta charset="utf-8"><title>Final Ad Frame</title>
<style>
@font-face{font-family:"Mont";src:url("montserrat.woff2") format("woff2");font-weight:100 900;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"Mont",sans-serif;color:#fff;position:relative;
 background:radial-gradient(900px 700px at 80% 0%,rgba(30,215,96,.22),transparent 60%),radial-gradient(800px 800px at 0% 100%,rgba(120,80,255,.16),transparent 60%),#0b0b0d}
.abs{position:absolute}
#chip{left:48px;top:70px;border:2px solid #1ED760;color:#1ED760;border-radius:40px;padding:10px 22px;font:700 24px "Mont";letter-spacing:3px}
#t{left:48px;top:140px;font:900 76px/84px "Mont";letter-spacing:-3px}
#t span{color:#1ED760}
#s{left:48px;top:330px;font:800 34px/60px "Mont"}#s b{color:#1ED760}
#slot{left:0;top:656px;width:1080px;height:608px;background:#000}
#glow{left:90px;top:600px;width:900px;height:720px;border-radius:50%;background:#1ED760;filter:blur(140px);opacity:.25}
#track{left:48px;top:1340px;width:984px;height:10px;border-radius:5px;background:#2c2c30}
#b1{left:48px;top:1400px;font:700 40px "Mont"}
#b2{left:48px;top:1462px;font:500 30px "Mont";color:#aaa}
#cta{left:48px;top:1700px;width:984px;height:120px;border-radius:60px;background:#1ED760;color:#000;font:900 44px/120px "Mont";text-align:center;letter-spacing:-1px}
</style></head>
<body>
<div class="abs" id="glow"></div>
<div class="abs" id="chip">FINAL RESULT</div>
<div class="abs" id="t">Spotify Ad in <span>After Effects</span></div>
<div class="abs" id="s"><b>▶ FINAL</b> AD · 30 sec</div>
<div class="abs" id="slot"></div>
<div class="abs" id="track"></div>
<div class="abs" id="b1">Logo · Motion · App UI · Sound</div>
<div class="abs" id="b2">Designed &amp; animated in After Effects on MacBook</div>
<div class="abs" id="cta">Follow for more motion design ✦</div>
</body></html>
