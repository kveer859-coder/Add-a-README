html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Inter",sans-serif;color:#f5f5f7;-webkit-font-smoothing:antialiased}
.abs{position:absolute}

.half.L{left:0}
.half.R{left:330px;transform-origin:0 50% 6px}
.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden}
.half.L .front{border-radius:46px 0 0 46px;transform:translateZ(6px)}
.half.R .front{border-radius:0 46px 46px 0;transform:translateZ(6px)}
.half.L .back{border-radius:0 46px 46px 0;transform:rotateY(180deg) translateZ(6px)}
.half.R .back{border-radius:46px 0 0 46px;transform:rotateY(180deg) translateZ(-6px)}
.edge{position:absolute;top:18px;width:12px;height:464px;backface-visibility:visible;border-radius:6px}

.half.R .edge{left:324px;transform:rotateY(90deg)}

.bez>.in{position:absolute;inset:9px;overflow:hidden}
.half.L .front .bez>.in{border-radius:38px 0 0 38px;right:0}
.half.R .front .bez>.in{border-radius:0 38px 38px 0;left:0}
.half.R .back .bez>.in{border-radius:38px}
.scr{position:absolute;top:0;width:642px;height:482px}

.sheen{position:absolute;top:-100px;width:160px;height:700px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:rotate(18deg)}
.plate{position:absolute;left:22px;top:22px;width:150px;height:150px;border-radius:40px}

<script>

const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

const lerp=(a,b,x)=>a+(b-a)*x;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

function setRig(r,{ry=0,rx=0,rz=0,s=1,x=0,y=0,open=1,o=1}){
  const shift=(1-open)*165; // keep visible body centred while folding
  r.style.opacity=o; r.style.display=o<=0.001?'none':'block';
  r.style.transform=`translate(${x}px,${y}px) scale(${s}) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) translateX(${shift}px)`;
  r.querySelector('.half.R').style.transform=`rotateY(${-180*(1-open)}deg)`;
}
function rigScreen(r,t,{split=0,route=0,bubbles=0,crease=1,sheenX=-300,wb=0}){
  r.querySelectorAll('.split').forEach(e=>e.style.opacity=split);
  r.querySelectorAll('.route').forEach(e=>e.style.strokeDashoffset=1-route);
  r.querySelectorAll('.pin').forEach(e=>{const p=(t*1.4)%1;e.style.boxShadow=`0 0 0 ${p*26}px rgba(255,59,48,${.5*(1-p)})`;});
  r.querySelectorAll('.bub').forEach((e,j)=>{const i=j%5;const x=eb(clamp(bubbles-i));e.style.opacity=clamp(bubbles-i);e.style.transform=`scale(${.6+.4*x})`;});
  r.querySelectorAll('.crease').forEach(e=>e.style.opacity=crease);
  r.querySelectorAll('.sheen').forEach(e=>e.style.left=sheenX+'px');
  r.querySelectorAll('.wb1').forEach(e=>e.style.transform=`translate(${Math.sin(t*.8+wb)*60}px,${Math.cos(t*.6)*40}px)`);
}


// ================= BUY AD =================
function interpK(K,t,bounce=-1){
  if(t<=K[0][0])return K[0].slice(1);
  for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(t<=b[0]){let x=(t-a[0])/(b[0]-a[0]);x=i===bounce?eb(x):eio(x);return a.slice(1).map((v,j)=>lerp(v,b[j+1],x));}}
  return K[K.length-1].slice(1);
}
